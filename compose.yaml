services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?required}
      POSTGRES_USER: ${DATABASE_USER:?required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    command: ["python", "manage.py", "run_outbox_worker"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
