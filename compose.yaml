services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?required}
      POSTGRES_USER: ${DATABASE_USER:?required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    environment:
      MP_ALLOWED_HOSTS: mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    command: ["python", "manage.py", "run_outbox_worker"]
    restart: unless-stopped
    environment:
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  postgres_data:
