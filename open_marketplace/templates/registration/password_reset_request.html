{% extends "base.html" %}
{% block title %}Request password reset{% endblock %}
{% block page_class %}content-page form-page{% endblock %}
{% block content %}
<h1>Request password reset</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Continue</button>
</form>
{% endblock %}
