{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block page_class %}content-page form-page{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% endblock %}
