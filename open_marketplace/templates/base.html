<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Open Marketplace{% endblock %}</title>
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Навигация">
      <a href="{% url 'catalog-search' %}">Каталог</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'catalog-own' %}">Мои карточки</a>
        <a href="{% url 'security' %}">Безопасность аккаунта</a>
        {% if request.user.kind == "service" %}<a href="/admin/">Панель сотрудников</a><a href="{% url 'catalog-manage' %}">Управление каталогом</a>{% endif %}
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
